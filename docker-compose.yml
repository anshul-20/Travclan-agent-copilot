services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: copilot, POSTGRES_PASSWORD: copilot, POSTGRES_DB: copilot}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U copilot"], interval: 3s, retries: 20}
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: {context: ., dockerfile: Dockerfile}
    env_file: [.env.example]
    environment:
      DATABASE_URL: postgresql+psycopg2://copilot:copilot@db:5432/copilot
    depends_on: {db: {condition: service_healthy}}
    ports: ["8000:8000"]   # empty DB is auto-seeded with synthetic data on first start
volumes: {pgdata: {}}
